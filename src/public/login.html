<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bissú Capacity - Iniciar Sesión</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="inline-block">
        <h1 class="font-brand text-4xl tracking-tight font-black text-black inline-block">
          biss<span class="text-[#D81B60]">ú</span>
        </h1>
        <span class="block text-xs font-bold tracking-widest text-gray-500 uppercase mt-1">ACCESORIOS</span>
      </div>
      <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-pink-50 border border-pink-100 rounded-full">
        <span class="w-2 h-2 rounded-full bg-[#D81B60]"></span>
        <span class="text-xs font-semibold text-[#D81B60] tracking-wide uppercase">Capacity System</span>
      </div>
    </div>

    <!-- Login Card -->
    <div class="antigravity-card p-8 bg-white/90">
      <h2 class="text-2xl font-bold text-gray-900 mb-1 font-brand">Bienvenido de nuevo</h2>
      <p class="text-sm text-gray-500 mb-6">Ingresa con tus credenciales corporativas para gestionar la asistencia de tienda.</p>

      <form id="login-form" class="space-y-5">
        <div>
          <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Correo Corporativo</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required 
            placeholder="ej. bissujesusmaria@bissu.pe" 
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#D81B60] focus:border-transparent outline-none transition-all text-sm bg-white"
          >
        </div>

        <div>
          <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••" 
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-[#D81B60] focus:border-transparent outline-none transition-all text-sm bg-white"
          >
        </div>

        <div id="login-error" class="hidden p-3 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl font-medium"></div>

        <button 
          type="submit" 
          id="btn-login"
          class="w-full py-3.5 btn-bissu flex items-center justify-center gap-2 text-sm uppercase tracking-wider font-bold"
        >
          <span>Ingresar a la Plataforma</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- Quick Demo Credentials -->
      <div class="mt-8 pt-6 border-t border-gray-100">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Acceso Rápido de Demo</p>
        <div class="grid grid-cols-2 gap-2">
          <button 
            type="button" 
            onclick="fillDemo('bissujesusmaria@bissu.pe')" 
            class="px-3 py-2 text-xs bg-gray-50 hover:bg-pink-50 hover:text-[#D81B60] border border-gray-200 rounded-lg text-gray-600 transition-all font-medium text-center"
          >
            Tienda Jesús María
          </button>
          <button 
            type="button" 
            onclick="fillDemo('admin@bissu.pe')" 
            class="px-3 py-2 text-xs bg-gray-50 hover:bg-pink-50 hover:text-[#D81B60] border border-gray-200 rounded-lg text-gray-600 transition-all font-medium text-center"
          >
            Administrador Global
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // Redirigir si ya hay token activo
    if (localStorage.getItem('bissu_jwt')) {
      window.location.href = '/';
    }

    function fillDemo(email) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = '123456';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');

      errorDiv.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = `
        <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Verificando...</span>
      `;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Error al iniciar sesión');
        }

        localStorage.setItem('bissu_jwt', data.token);
        localStorage.setItem('bissu_user', JSON.stringify(data.user));

        window.location.href = '/';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `
          <span>Ingresar a la Plataforma</span>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        `;
      }
    });
  </script>
</body>
</html>
